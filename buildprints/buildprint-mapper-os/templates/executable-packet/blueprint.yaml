schema_version: buildprint/kernel/v1
execution_start: BUILDPRINT.md
machine_contract: blueprint.yaml
claim_status: product_build_required
qualification_label: local_build_requires_review

deployment_posture:
  current: trusted_local
  allowed_values:
    - trusted_local
    - private_authenticated
    - public_webapp

read_order:
  - BUILDPRINT.md
  - 00-goal.md
  - 01-setup.md
  - 02-identity.md
  - blueprint.yaml
  - loops/loop-index.yaml
  - loops/loop-flow.md
  - review.md
  - README.md
  - HANDOVER.md

packet_shape:
  style: kernel_loop
  principle: YAML routes; markdown teaches and builds.
  required_files:
    - BUILDPRINT.md
    - 00-goal.md
    - 01-setup.md
    - 02-identity.md
    - blueprint.yaml
    - loops/loop-index.yaml
    - loops/loop-flow.md
    - review.md
    - README.md
    - HANDOVER.md

kernel:
  flow: goal → bare_agentic_loop → optional_independent_fan_out → contract_review
  bare_agentic_loop: think → act → observe until done or stuck
  independent_fan_out: clean ownership only; each worker gets goal slice + contract; no shared mutable context
  contract_review: fresh-context reviewer against 00-goal.md and active loop contract; builder chat excluded
  rule: Production maturity is never the floor for first success.

maturity_upgrades:
  rule: Optional and claim-gated. Do not require these for the first successful loop.
  examples:
    - budgets_and_loop_breakers
    - run_receipts_and_session_logs
    - swarm_ledgers_and_concurrency_proof
    - trust_zones_and_capability_grants

loop_contract:
  required_headings:
    - How to implement this loop
    - Building objective
    - DO NOT
    - Minimum proof before moving on
    - Handoff note
  rule: Each loop is one coherent product path. Do not decompose into tiny schema sections.
  forbidden_shapes:
    - slices/
    - gates/
    - 03-phases/
    - 00-questions.md
    - 01-project-setup.md
    - 02-ui-identity.md
    - evidence-ledger
    - claim-gates.json
    - generated/agent-prompt.md
    - generated/codex-handoff.md

agent_contract:
  role: Senior Product Engineer
  rule: Build the product loop honestly from comprehensive loop objectives. A loop is not complete from edits, prose, placeholders, mocks, or screenshots alone. Visible controls must work or block honestly; live/provider/deployment claims require matching proof.

harness:
  provider: agents
  profiles:
    - webapp
  selection_rule: Replace these template profiles with the selected artifact's needs. Use webapp for responsive UI/product surfaces, backend for APIs/data/migrations/security-heavy services, agentic for agent runtimes/tools/memory/subagent systems, and full only when broad coverage is explicitly worth the extra context.

central_output_contract:
  rule: Replace this template-level rule with the selected artifact's source-derived central output contract before implementation begins.
  central_output: source-derived artifact output that the user/operator actually values
  output_primitives:
    - source-derived unit of useful output
  quality_signals:
    - source-derived signal that output is useful, correct, credible, publishable, actionable, or domain-appropriate
  unacceptable_generic_substitutes:
    - technically input-derived but domain-generic output
  reviewer_acceptance_questions:
    - What does the output make clear that a generic shell would not?
    - What can the user/operator do next from the output?
    - Which quality claim remains unproven?
  claim_gates:
    - do not claim central output quality until reviewer acceptance questions are answered with proof
  minimum_standard: The product path must produce output that reaches the mapped artifact's quality bar, not merely output that depends on input.

typed_quality_gates:
  rule: Select only the gates that match the artifact type; do not copy every possible gate into every packet.
  ui_decision_precision:
    applies_when: artifact has human-facing UI
  visual_viewport_acceptance:
    applies_when: artifact has responsive or browser/app UI
  semantic_output_acceptance:
    applies_when: artifact generates, transforms, recommends, summarizes, analyzes, or composes output
  integration_operator_acceptance:
    applies_when: artifact is a plugin, integration, CLI, service, worker, automation, API, or background job
  contract_review:
    applies_when: always
    file: review.md

state_and_handoff:
  local_state_dir: .buildprint/
  setup_receipt: .buildprint/setup-receipt.md
  readme_template: README.md
  handover_template: HANDOVER.md

proven_implementation_requirements:
  rule: Replace or specialize this template-level rule during selected extraction. Hard product domains must use proven libraries, SDKs, runtimes, or platform services unless a from-scratch alternative is explicitly justified and proven against the same acceptance criteria. Keep selected packets stack-neutral, but do not let builders casually hand-roll fixed-format export, rich text editing, document parsing, drag reorder behavior, charts, provider clients, task status, frontend UI runtime, component/state styling, design token enforcement, responsive viewport proof, migrations, or any from-scratch custom implementation without equal proof.
  detect_from_source:
    - fixed-format export or rendering
    - rich text or inline editing
    - document parsing or ingestion
    - drag/reorder/canvas interaction
    - charts, diagrams, maps, timelines, code rendering, or visual primitives
    - live provider SDKs, OAuth, webhooks, external APIs, or local model runtimes
    - frontend UI runtime, stateful screen composition, component/state styling, responsive viewport proof, or design token enforcement
    - background jobs, export tasks, queues, retries, or long-running work
    - durable persistence, migrations, file/object storage, or sync
  selected_packet_must:
    - name hard domains that are source-derived product requirements
    - require a proven package/runtime/service category for each hard domain
    - keep implementation choices stack-neutral unless the source makes a specific stack part of the product contract
    - allow from-scratch alternatives only with explicit justification and proof equal to the proven tool path
    - record selected package/runtime choices in docs/architecture.md during setup
