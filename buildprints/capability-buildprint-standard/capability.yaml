schema: agent-buildprint/capability.v0
name: capability-buildprint-standard
type: capability-standard
title: Capability Buildprint Standard
description: Defines the kernel Capability Buildprint format for packaging reusable agent-installable software capabilities.
capability: standards.capability-buildprints
status: draft-standard
canonical_start: BUILDPRINT.md
read_order:
  - BUILDPRINT.md
  - capability.yaml
  - compatibility.md
  - 00-goal.md
  - 01-host.md
  - loops/loop-flow.md
  - loops/01-contract-and-config.md
  - loops/02-core-integration.md
  - loops/03-host-wiring.md
  - loops/04-operator-surface.md
  - review.md
  - verify.md
  - schemas/capability.schema.json
  - examples/stripe-subscriptions/capability.yaml
  - examples/rbac-permissions/capability.yaml
packet_shape:
  style: kernel_loop
  required_files:
    - BUILDPRINT.md
    - capability.yaml
    - 00-goal.md
    - 01-host.md
    - review.md
    - verify.md
    - compatibility.md
    - loops/loop-flow.md
    - loops/01-contract-and-config.md
    - loops/02-core-integration.md
    - loops/03-host-wiring.md
    - loops/04-operator-surface.md
  optional_directories:
    - examples/
    - scripts/
    - references/
authoring_contract:
  primary_unit: one bounded reusable capability
  not_for:
    - whole product rebuilds
    - broad architecture plans
    - vague prompt collections
    - vendor docs copied without host adaptation rules
  must_define:
    - capability identity
    - execution profile
    - supported host signals
    - required inputs and secrets
    - integration surfaces
    - goal and host assessment
    - verification proof
    - failure modes
    - composition rules
kernel:
  flow: goal → bare_agentic_loop → optional_independent_fan_out → contract_review
minimum_capability_fields:
  - schema
  - name
  - type
  - capability
  - description
  - execution_profile
  - claim_status
  - host_frameworks
  - host_detection
  - requires
  - touches
  - apply
  - verify
  - risk
  - failure_modes
  - composition
verification_rule: A capability is not installed until its declared verification checks pass or blockers are reported explicitly.
execution_profiles:
  light:
    use_for:
      - additive helpers
      - local UI helpers
      - non-sensitive configuration
    requires:
      - goal
      - host
      - verification
      - contract-review
  guarded:
    use_for:
      - auth
      - billing
      - RBAC
      - database changes
      - webhooks
      - provider integrations
    requires:
      - goal
      - host
      - loops
      - blocked-state-proof
      - verification
      - contract-review
  strict:
    use_for:
      - destructive operations
      - production data migration
      - security boundary changes
      - public deployment
    requires:
      - goal
      - host
      - rollback-plan
      - security-boundary-check
      - contract-review
      - verification
risk_levels:
  - low
  - medium
  - high
  - critical

composition:
  expects: []
  provides:
    - capability-buildprint-format
  conflicts_with: []
